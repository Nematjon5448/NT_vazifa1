{% if messages %}
<ul class="messages">
{% for message in messages %}
  <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>
  <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}" role="alert">
  {{ message }}
  </div>
  </li>
{% endfor %}
</ul>
{% endif %}
