<header>
    <nav class="navbar navbar-expand-lg navbar-light bg-body-tertiary">
        <div class="container-fluid">
            <div class="collapse navbar-collapse">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item">
                        <a href="{% url 'asosiy_sahifa' %}">Asosiy sahifa</a>
                    </li>
                    <li class="breadcrumb-item">
                        <a href="{% url 'mashina_qoshish' %}">Mashina qo'shish</a>
                    </li>
                </ol>
            </div>

            <div>
                <form class="d-flex input-group w-auto">
                  <input
                          name="query"
                    type="search"
                    class="form-control rounded"
                    placeholder="Search"
                    aria-label="Search"
                    aria-describedby="search-addon"
                  />
                  <span class="input-group-text border-0" id="search-addon">
                    <i class="fas fa-search"></i>
                  </span>
                </form>
            </div>

            {% if not request.user.is_authenticated %}
            <div class="d-flex align-items-center">
                <a href="{% url 'login' %}" class="btn btn-link px-3 me-2">
                    Login
                </a>
                <a href="{% url 'register' %}" class="btn btn-primary me-3">
                    Sign up for free
                </a>
            </div>
            {% else %}
            <div class="d-flex align-items-center">
                <a href="{% url 'logout' %}" class="btn btn-primary me-3">
                    Logout
                </a>
            </div>
            {% endif %}
        </div>
    </nav>
</header>
